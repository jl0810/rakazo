services:
  api:
    build:
      context: ../..
      dockerfile: infra/dokploy/Dockerfile
    command: ["bash", "-lc", "pnpm --filter @rakazo/db exec prisma migrate deploy && pnpm --filter @rakazo/api start"]
    environment:
      - DATABASE_URL=postgres://postgres:REDACTED_OLD_POSTGRES_PASSWORD@100.81.25.91:5432/rakazo
      - DATA_DIR=/data
      - WAKEUP_DRIVER=graphile
      - AGENT_RUNTIME=devin-cli
      - SANDBOX_PROVIDER=fake
      - DEVIN_CLI_PATH=/usr/local/bin/devin
      - DEVIN_MODEL=sonnet
      - BETTER_AUTH_SECRET=3b9f04db62f81dd223d3f23eee073321572d64d9f0876d77b29c3e4b03f1e8fe
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - API_URL=${API_URL}
      - WEB_ORIGIN=${WEB_ORIGIN}
      - SIGNUPS_ENABLED=true
      - ENCRYPTION_KEY=39fe16bb1f45837f8484e0039237c3e16bbbafe034b184cca9ae383cf7146f4e
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - NODE_ENV=production
    volumes:
      - rakazo-data:/data
      - devin-creds:/root/.local/share/devin
    networks:
      - default
      - dokploy
    ports:
      - "3100:3100"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.rakazo-api-rpc.rule=Host(`rakazo.raydoug.com`) && (PathPrefix(`/api`) || PathPrefix(`/rpc`))"
      - "traefik.http.routers.rakazo-api-rpc.entrypoints=websecure"
      - "traefik.http.routers.rakazo-api-rpc.tls.certresolver=letsencrypt"
      - "traefik.http.routers.rakazo-api-rpc.priority=100"
      - "traefik.http.routers.rakazo-api-rpc.service=rakazo-api-svc"
      - "traefik.http.services.rakazo-api-svc.loadbalancer.server.port=3100"

  worker:
    build:
      context: ../..
      dockerfile: infra/dokploy/Dockerfile
    command: ["pnpm", "--filter", "@rakazo/worker", "start"]
    environment:
      - DATABASE_URL=postgres://postgres:REDACTED_OLD_POSTGRES_PASSWORD@100.81.25.91:5432/rakazo
      - DATA_DIR=/data
      - WAKEUP_DRIVER=graphile
      - AGENT_RUNTIME=devin-cli
      - SANDBOX_PROVIDER=fake
      - DEVIN_CLI_PATH=/usr/local/bin/devin
      - DEVIN_MODEL=sonnet
      - BETTER_AUTH_SECRET=3b9f04db62f81dd223d3f23eee073321572d64d9f0876d77b29c3e4b03f1e8fe
      - ENCRYPTION_KEY=39fe16bb1f45837f8484e0039237c3e16bbbafe034b184cca9ae383cf7146f4e
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - NODE_ENV=production
    volumes:
      - rakazo-data:/data
      - devin-creds:/root/.local/share/devin
    depends_on:
      - api

  web:
    build:
      context: ../..
      dockerfile: infra/dokploy/Dockerfile
    command: ["pnpm", "--filter", "@rakazo/web", "preview", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      - API_PROXY_TARGET=http://api:3100
      - BETTER_AUTH_SECRET=3b9f04db62f81dd223d3f23eee073321572d64d9f0876d77b29c3e4b03f1e8fe
      - NODE_ENV=production
    ports:
      - "5173:5173"
    networks:
      - default
      - dokploy
    depends_on:
      - api

networks:
  default:
    name: rakazo-internal
  dokploy:
    external: true
    name: dokploy-network

volumes:
  rakazo-data:
  devin-creds:
