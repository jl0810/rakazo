services:
  computer:
    image: rakazo/computer:local
    build:
      context: ../sandboxes/computer
    command: ["true"]
    restart: "no"

  supervisor:
    build:
      context: ../..
      dockerfile: infra/sandboxes/supervisor/Dockerfile
    environment:
      - DATA_DIR=/data
      - SUPERVISOR_HOST=0.0.0.0
      - SUPERVISOR_PORT=7091
      - DOCKER_SOCKET=/var/run/docker.sock
      - RAKAZO_COMPUTER_IMAGE=rakazo/computer:local
      - SANDBOX_SCREEN_NETWORK=internal
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - NODE_ENV=production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - rakazo-data:/data
    networks:
      - default
    depends_on:
      computer:
        condition: service_completed_successfully

  api:
    build:
      context: ../..
      dockerfile: infra/dokploy/Dockerfile
    command: ["bash", "-lc", "node /app/infra/dokploy/render-mcp-config.mjs && pnpm --filter @rakazo/db exec prisma migrate deploy && pnpm --filter @rakazo/api start"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATA_DIR=/data
      - WAKEUP_DRIVER=graphile
      - AGENT_RUNTIME=devin-cli
      - SANDBOX_PROVIDER=docker
      - SANDBOX_SUPERVISOR_URL=http://supervisor:7091
      - DEVIN_CLI_PATH=/usr/local/bin/devin
      - DEVIN_MODEL=glm-5-2
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - API_URL=${API_URL}
      - WEB_ORIGIN=${WEB_ORIGIN}
      - SIGNUPS_ENABLED=true
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DOKPLOY_API_KEY=${DOKPLOY_API_KEY}
      - DOKPLOY_URL=${DOKPLOY_URL}
      - POSTGRES_MCP_URL_MAIN=${POSTGRES_MCP_URL_MAIN}
      - POSTGRES_MCP_URL_TRADE=${POSTGRES_MCP_URL_TRADE}
      - POSTGRES_MCP_URL_ETF=${POSTGRES_MCP_URL_ETF}
      - NODE_ENV=production
    volumes:
      - rakazo-data:/data
      - devin-creds:/root/.local/share/devin
    networks:
      - default
      - dokploy
    ports:
      - "3100:3100"
    depends_on:
      supervisor:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.rakazo-api-rpc.rule=Host(`${RAKAZO_HOST:-app.example.com}`) && (PathPrefix(`/api`) || PathPrefix(`/rpc`))"
      - "traefik.http.routers.rakazo-api-rpc.entrypoints=websecure"
      - "traefik.http.routers.rakazo-api-rpc.tls.certresolver=letsencrypt"
      - "traefik.http.routers.rakazo-api-rpc.priority=100"
      - "traefik.http.routers.rakazo-api-rpc.service=rakazo-api-svc"
      - "traefik.http.services.rakazo-api-svc.loadbalancer.server.port=3100"

  worker:
    build:
      context: ../..
      dockerfile: infra/dokploy/Dockerfile
    command: ["bash", "-lc", "node /app/infra/dokploy/render-mcp-config.mjs && pnpm --filter @rakazo/worker start"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATA_DIR=/data
      - WAKEUP_DRIVER=graphile
      - AGENT_RUNTIME=devin-cli
      - SANDBOX_PROVIDER=docker
      - SANDBOX_SUPERVISOR_URL=http://supervisor:7091
      - DEVIN_CLI_PATH=/usr/local/bin/devin
      - DEVIN_MODEL=glm-5-2
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DOKPLOY_API_KEY=${DOKPLOY_API_KEY}
      - DOKPLOY_URL=${DOKPLOY_URL}
      - POSTGRES_MCP_URL_MAIN=${POSTGRES_MCP_URL_MAIN}
      - POSTGRES_MCP_URL_TRADE=${POSTGRES_MCP_URL_TRADE}
      - POSTGRES_MCP_URL_ETF=${POSTGRES_MCP_URL_ETF}
      - NODE_ENV=production
    volumes:
      - rakazo-data:/data
      - devin-creds:/root/.local/share/devin
    depends_on:
      api:
        condition: service_started
      supervisor:
        condition: service_started

  web:
    build:
      context: ../..
      dockerfile: infra/dokploy/Dockerfile
    command: ["pnpm", "--filter", "@rakazo/web", "preview", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      - API_PROXY_TARGET=http://api:3100
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - RAKAZO_HOST=${RAKAZO_HOST:-app.example.com}
      - NODE_ENV=production
    ports:
      - "5173:5173"
    networks:
      - default
      - dokploy
    depends_on:
      - api

networks:
  default:
    name: rakazo-internal
  dokploy:
    external: true
    name: dokploy-network

volumes:
  rakazo-data:
  devin-creds:
